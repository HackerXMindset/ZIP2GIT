name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias pushbox -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass pushbox123 -keypass pushbox123 -dname "CN=Pushbox"
            echo "KEYSTORE_PASSWORD=pushbox123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=pushbox" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Pushbox-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/release/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "Pushbox (latest build)" \
            --notes "Download app-release.apk and install it on Android. Built from ${GITHUB_SHA::7}."

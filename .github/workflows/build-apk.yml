name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          PW_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PW="$(printf '%s' "$PW_SECRET" | tr -d '[:space:]')"
          JKS="$RUNNER_TEMP/release.jks"
          if [ -n "$PW" ] && keytool -list -keystore app/pushbox-release.jks -storepass "$PW" -alias pushbox >/dev/null 2>&1; then
            cp app/pushbox-release.jks "$JKS"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNING=your saved key, so this APK installs over the previous one." >> "$GITHUB_ENV"
          else
            if [ -z "$PW" ]; then
              echo "::warning::The KEYSTORE_PASSWORD secret is not set. Building with a temporary key."
            else
              echo "::warning::The KEYSTORE_PASSWORD secret does not open the signing key. Check the value. Building with a temporary key."
            fi
            keytool -genkeypair -keystore "$JKS" -alias pushbox -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass pushbox123 -keypass pushbox123 -dname "CN=Pushbox"
            echo "KEYSTORE_PASSWORD=pushbox123" >> "$GITHUB_ENV"
            echo "SIGNING=a temporary key. Uninstall the old app before installing this one." >> "$GITHUB_ENV"
          fi
          echo "KEY_ALIAS=pushbox" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Pushbox-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/release/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "Pushbox (latest build)" \
            --notes "Download app-release.apk and install it on Android. Build ${GITHUB_RUN_NUMBER}, from ${GITHUB_SHA::7}. Signed with ${SIGNING}"
